---
btrbk_remotes:
# Specify at least one host:path pair.
# Each pair will be added as a remote per subvolume
  - host: "mimer.home.m0n.in"
    path: "/mnt/sysdata/backups"
# if subvolumes are specified with a wildcard,
# any btrfs subvolumes that are
# - immediate children
# - not hidden
# will be backed up
btrbk_subvolumes:
  - /srv/*
btrbk_ssh_private_key: "{{ ssh.private_key }}"
btrbk_ssh_public_key: "{{ user.pubkey }}"
